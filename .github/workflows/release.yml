name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # пробная сборка Windows-приложения без релиза: результат — artifact
permissions:
  contents: write
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Проверка версии тега
        run: |
          v=$(python -c "import ecocorridor; print(ecocorridor.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Тег ${GITHUB_REF_NAME} не совпадает с версией $v"; exit 1; }
      - run: python -m build
      - name: Заметки из CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v"$" {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*

  windows-exe:
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install . pyinstaller
      - name: Сборка приложения
        shell: pwsh
        run: powershell -File packaging/build_exe.ps1
      - name: Проверка собранного приложения
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ecocorridor\ecocorridor.exe -ArgumentList "--no-browser","--port","8765" -PassThru -RedirectStandardOutput exe.log -RedirectStandardError exe.err
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { $h = Invoke-RestMethod http://127.0.0.1:8765/api/health; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { Get-Content exe.log, exe.err; Stop-Process $p -Force; throw "приложение не отвечает" }
          Write-Host "health:" ($h | ConvertTo-Json -Compress)
          $r = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8765/api/analyze -ContentType "application/json" -Body '{"scenario":"base"}'
          Write-Host "PC =" $r.fragmentation.pc "PC(cost) =" $r.fragmentation.pc_cost
          if (-not ($r.fragmentation.pc -gt 0.48 -and $r.fragmentation.pc -lt 0.49)) { Get-Content exe.log, exe.err; Stop-Process $p -Force; throw "неожиданное значение PC" }
          $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/
          if ($page.Content -notmatch "EcoCorridor") { Stop-Process $p -Force; throw "главная страница не отдалась" }
          Stop-Process $p -Force
      - name: Архив
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE dist\ecocorridor\
          $v = (python -c "import ecocorridor; print(ecocorridor.__version__)")
          Compress-Archive -Path dist\ecocorridor -DestinationPath "ecocorridor-$v-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ecocorridor-windows
          path: ecocorridor-*-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ecocorridor-*-windows-x64.zip
